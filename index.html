
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9e8ef">
  <title>Digitize a Memory</title>

  <style>
    :root {
      --pink: #d98fa7;
      --pink-light: #f9e8ef;
      --pink-dark: #a64d70;
      --cream: #fffaf7;
      --text: #733e55;
      --green: #34845b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: var(--cream);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin: 24px 0 32px;
    }

    h1 {
      margin-bottom: 8px;
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 2rem;
    }

    .subtitle {
      color: #95627a;
      line-height: 1.5;
    }

    .panel {
      padding: 20px;
      border: 1px solid #f0dce5;
      border-radius: 22px;
      background: white;
      box-shadow: 0 8px 28px #733e550b;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .setting-label {
      font-weight: 650;
    }

    .setting-help {
      margin-top: 5px;
      font-size: 0.85rem;
      color: #95627a;
    }

    .toggle {
      position: relative;
      flex: 0 0 auto;
      width: 54px;
      height: 32px;
      border: none;
      border-radius: 30px;
      padding: 3px;
      background: #b7b7b7;
      cursor: pointer;
      transition: background 180ms ease;
    }

    .toggle[aria-checked="true"] {
      background: var(--pink);
    }

    .knob {
      display: block;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 3px #0002;
      transition: transform 180ms ease;
    }

    .toggle[aria-checked="true"] .knob {
      transform: translateX(22px);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #a64d70;
      outline-offset: 3px;
    }

    .camera-button,
    .save-button,
    .secondary-button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .camera-button,
    .save-button {
      margin-top: 20px;
      background: var(--pink);
      color: white;
    }

    .secondary-button {
      margin-top: 10px;
      background: var(--pink-light);
      color: var(--pink-dark);
    }

    .camera-button:hover,
    .save-button:hover {
      background: var(--pink-dark);
    }

    #photoInput {
      display: none;
    }

    #previewArea {
      margin-top: 20px;
    }

    #photoPreview {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      background: #f8f1f3;
    }

    .hint {
      margin: 12px 0 0;
      font-size: 0.85rem;
      color: #95627a;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    #toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 24px;
      max-width: 440px;
      margin: auto;
      padding: 16px;
      border-radius: 14px;
      background: #e5f4e8;
      color: #246b45;
      box-shadow: 0 6px 24px #0002;
      text-align: center;
    }

    #toast.error {
      background: #fff0ee;
      color: #963d35;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Digitize a Memory ♡</h1>
      <p class="subtitle">
        A little place to preserve your family's memories.
      </p>
    </header>

    <section class="panel">
      <div class="setting">
        <div>
          <div class="setting-label">
            Preview before saving
          </div>
          <div class="setting-help" id="modeHelp">
            Review every memory before saving.
          </div>
        </div>

        <button
          class="toggle"
          id="previewToggle"
          type="button"
          role="switch"
          aria-checked="true"
          aria-label="Preview before saving"
        >
          <span class="knob"></span>
        </button>
      </div>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <button class="camera-button" id="cameraButton">
        ♡ Take a photo
      </button>

      <div id="previewArea" hidden>
        <img id="photoPreview" alt="Photo selected for digitizing">

        <p class="hint" id="previewHint">
          Check your photo before saving.
        </p>

        <button class="save-button" id="saveButton">
          Save JPEG
        </button>

        <button class="secondary-button" id="retakeButton">
          Retake photo
        </button>
      </div>

      <p class="hint">
        Prototype: image capture and JPEG saving are being tested.
        Automatic cropping and cloud backup come next.
      </p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    // Find the HTML elements we'll interact with.
    const toggle = document.getElementById("previewToggle");
    const modeHelp = document.getElementById("modeHelp");
    const photoInput = document.getElementById("photoInput");
    const cameraButton = document.getElementById("cameraButton");
    const previewArea = document.getElementById("previewArea");
    const photoPreview = document.getElementById("photoPreview");
    const previewHint = document.getElementById("previewHint");
    const saveButton = document.getElementById("saveButton");
    const retakeButton = document.getElementById("retakeButton");
    const toast = document.getElementById("toast");

    // Restore the user's most recent preference.
    const savedSetting = localStorage.getItem("previewBeforeSave");
    let previewEnabled = savedSetting === null
      ? true
      : savedSetting === "true";

    let selectedImage = null;
    let imageUrl = null;
    let toastTimer = null;

    // Restore the next photo number, starting at 00001.
    let nextPhotoNumber = Number.parseInt(
      localStorage.getItem("nextPhotoNumber") || "1",
      10
    );

    function updateMode() {
      toggle.setAttribute("aria-checked", String(previewEnabled));

      modeHelp.textContent = previewEnabled
        ? "Review every memory before saving."
        : "Skip review for faster saving.";

      previewHint.textContent = previewEnabled
        ? "Check your photo before saving."
        : "Quick mode: saving your photo automatically.";
    }

    toggle.addEventListener("click", () => {
      previewEnabled = !previewEnabled;

      // Persist the setting across visits to this website.
      localStorage.setItem(
        "previewBeforeSave",
        String(previewEnabled)
      );

      updateMode();
    });

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.toggle("error", isError);
      toast.hidden = false;

      toastTimer = setTimeout(() => {
        toast.hidden = true;
      }, 3000);
    }

    function clearSelectedImage() {
      if (imageUrl) {
        URL.revokeObjectURL(imageUrl);
      }

      imageUrl = null;
      selectedImage = null;
      photoPreview.removeAttribute("src");
      previewArea.hidden = true;
      photoInput.value = "";
    }

    cameraButton.addEventListener("click", () => {
      photoInput.click();
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showToast("Please select an image file.", true);
        return;
      }

      clearSelectedImage();

      selectedImage = file;
      imageUrl = URL.createObjectURL(file);
      photoPreview.src = imageUrl;
      previewArea.hidden = false;

      if (previewEnabled) {
        showToast("Photo ready to review!");
      } else {
        saveJpeg();
      }
    });

    function saveJpeg() {
      if (!selectedImage) {
        showToast("Take a photo first.", true);
        return;
      }

      const image = new Image();

      image.onload = () => {
        try {
          // Convert the selected image to JPEG using a canvas.
          const canvas = document.createElement("canvas");
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;

          const context = canvas.getContext("2d");

          // JPEG doesn't support transparency, so use white.
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0);

          canvas.toBlob((blob) => {
            if (!blob) {
              showToast("Couldn't create the JPEG. Please retry.", true);
              return;
            }

            try {
              const downloadUrl = URL.createObjectURL(blob);
              const link = document.createElement("a");

              link.href = downloadUrl;
              link.download =
                `memory-${nextPhotoNumber.toString().padStart(5, "0")}-${new Date().toISOString().replace(/[:.]/g, "-")}.jpg`;

              document.body.appendChild(link);
              link.click();
              link.remove();

              setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

              showToast(
                "JPEG prepared! Check your downloads to confirm it saved."
              );

              nextPhotoNumber++;
              localStorage.setItem("nextPhotoNumber", nextPhotoNumber.toString());

              clearSelectedImage();
            } catch (error) {
              showToast("Couldn't start the download. Please retry.", true);
            }
          }, "image/jpeg", 0.92);
        } catch (error) {
          showToast("Couldn't process this photo. Please retry.", true);
        }
      };

      image.onerror = () => {
        showToast("Couldn't open the photo. Please try another.", true);
      };

      image.src = imageUrl;
    }

    saveButton.addEventListener("click", saveJpeg);

    retakeButton.addEventListener("click", () => {
      clearSelectedImage();
      photoInput.click();
    });

    updateMode();
  </script>
</body>
</html>
